apis:
- aid: prizeout-publisher-widget
  name: Prizeout Publisher Widget and SDKs
  description: 'The Prizeout partner integration surface. A partner loads the first-party JavaScript
    publisher SDK (prizeout-publisher-sdk.js), or the native iOS/Android SDK, and passes partner
    credentials plus a user session and balance; the SDK renders the Prizeout widget in an iframe or
    view controller from the widget host. Prizeout then calls back into four partner-hosted HTTP
    endpoints - balance check, session validation, cash-out success and cash-out failure - to verify
    and settle the withdrawal. Credentials and the callback URLs are configured in the Prizeout
    Partners Dashboard; sandbox and production environments are both provided.'
