aid: prizeout
name: Prizeout
description: 'Prizeout is a New York City based advertising-technology and fintech company that turns
  a cash-out, payout or rewards balance into a bonused digital gift card. Its button sits on partner
  platforms wherever a withdrawal happens - online gaming and lottery apps, sportsbooks, earned-wage-access
  and payroll providers, insurance and marketplace platforms, and banks and credit unions - and runs a
  real-time auction in which participating brands bid to place a gift-card offer in front of the user,
  typically returning more value than the cash amount. Prizeout distributes the platform through an
  embeddable browser widget loaded by a first-party JavaScript publisher SDK, plus native iOS (Swift)
  and Android SDKs, and a set of partner-implemented HTTP callbacks for balance check, session
  validation and cash-out success/failure. Its CashBack+ product line (Offers, Actions, Pay and Credit
  Card Rewards) is delivered to credit unions through the Prizeout Partners CUSO.'
