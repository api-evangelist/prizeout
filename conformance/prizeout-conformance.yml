domain_standards:
  market: 'Gift cards / rewards / merchant-funded incentives, delivered into banking and gaming platforms'
  candidates_probed:
  - standard: 'GCVA (Gift Card and Voucher Association) membership'
    result: 'Prizeout Corp. is listed as a GCVA member (https://www.gcva.co.uk/members/prizeout-corp). This is a trade-association membership, not a technical interchange standard, and is recorded for context only - it earns no domain_standard_conformance credit.'
  - standard: 'FDX (Financial Data Exchange)'
    result: 'No FDX endpoint, schema or claim found. Prizeout does not aggregate financial data; it consumes a partner-supplied balance.'
  - standard: 'ISO 20022'
    result: 'No ISO 20022 message types. Prizeout does not move funds over payment rails in its published surface.'
  - standard: 'OpenRTB'
    result: >-
      Prizeout describes a real-time auction in which brands bid to place a gift-card offer, which
      is the OpenRTB shape - but no bid endpoint, no OpenRTB object names and no IAB claim appear on
      any public surface. Recorded as probed-and-missed, not asserted.
  - standard: 'Jack Henry Vendor Integration Program'
    result: >-
      Prizeout announced an expanded integration with the Jack Henry Vendor Integration Program
      (GlobeNewswire, 2023-04-13, linked from the published llms.txt). This is a certified
      banking-core integration program, not a published open standard, and the certification
      artifact is not public.
  conforms: false
  note: >-
    REWARD-ONLY dimension. Prizeout's market has candidate standards (OpenRTB for the auction side,
    core-banking vendor programs for the CU side) but Prizeout declares none of them in a contract,
    because it publishes no contract. No conformance was invented to fill the slot.
compliance_certifications:
  published_named_certs: false
  note: >-
    A Vanta-hosted trust center exists at https://trust.prizeout.com/ (HTTP 200, canonical
    https://trust.prizeout.com, title "Prizeout Trust Center"), but its contents are rendered
    entirely client-side by a React bundle - the served HTML carries only the title and description.
    No certification name (SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP) could be read from any
    machine-readable surface, and a targeted search returned no Prizeout-specific attestation.
    Because no certification is legible, NO Compliance pointer is wired into apis.yml. See
    security/prizeout-trust-center.yml.
